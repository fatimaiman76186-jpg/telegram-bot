services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - models:/models
      # shared with the local Bot API server so the bot can read files it downloads (only used with --profile bigfiles)
      - tgdata:/var/lib/telegram-bot-api

  # Optional: lifts Telegram's 20MB download limit (up to 2GB).
  # Enable with:  docker compose --profile bigfiles up -d --build
  # and set TELEGRAM_LOCAL_API_URL=http://telegram-bot-api:8081 in .env
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["bigfiles"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tgdata:/var/lib/telegram-bot-api

volumes:
  models:
  tgdata:
